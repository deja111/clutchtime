# Automatsko ažuriranje sajta na GitHub serverima (zamenjuje Task Scheduler i pokreni_azuriranje.bat).
# Posle svakog uspešnog pokretanja novi sajt se šalje u repozitorijum, a Vercel ga sam objavi.

name: Ažuriranje sajta

on:
  schedule:
    # GitHub koristi UTC vreme. Ovo je 8:23, 15:23 i 19:23 po zimskom vremenu u Srbiji;
    # po letnjem vremenu (od kraja marta) pokreće se sat kasnije.
    # Namerno NE na pun sat: tada je GitHub najopterećeniji i zakazana pokretanja
    # kasne ili se preskoče (30.10.2026. pokretanje u 8:00 se nije ni pojavilo).
    - cron: "23 7 * * *"
    - cron: "23 14 * * *"
    - cron: "23 18 * * *"
  workflow_dispatch:   # dugme "Run workflow" za ručno pokretanje (i sa telefona)

permissions:
  contents: write      # dozvola da sačuva novu bazu i sajt u repozitorijum

concurrency:
  group: azuriranje    # nikad dva ažuriranja u isto vreme
  cancel-in-progress: false

jobs:
  azuriraj:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Belgrade          # da "Ažurirano 24.10. 15:00" i sezona budu po našem vremenu
      PYTHONIOENCODING: utf-8

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instaliraj biblioteke
        run: pip install -r requirements.txt

      - name: Ažuriraj bazu (Evroliga API)
        run: python azuriraj_bazu.py

      - name: Kvote za propove (OddsPapi, samo na dan utakmice ili dan pre)
        # Bez Secret-a ODDSPAPI_KEY samo preskoči. Greška ovde ne sme da zaustavi sajt.
        continue-on-error: true
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python kvote.py

      - name: Napravi najavu kola
        run: python analiza.py

      - name: Napravi sajt (+ povrede iz Google tabele)
        run: python sajt.py

      - name: Sačuvaj bazu i sajt (Vercel ih zatim objavi)
        run: |
          # Autor izmena je vlasnik naloga, da bi Vercel prihvatio objavu
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A podaci/evroliga.db podaci/povrede_poslednje.csv podaci/kvote sajt
          if git diff --cached --quiet; then
            echo "Nema izmena, ništa ne šaljem."
            exit 0
          fi
          git commit -m "Ažuriranje $(date '+%d.%m.%Y. %H:%M')"
          git push

      - name: Provera grešaka
        # azuriraj_bazu.py beleži greške i nastavlja dalje. Ovde ih pretvaramo u
        # crveni X na GitHub-u + mejl obaveštenje, ali tek POSLE objave sajta.
        run: |
          if grep -E "Greška u sezoni|NIJE preuzeta|nije preuzet" podaci/log.txt; then
            echo "::error::Ažuriranje je imalo greške (vidi redove iznad)."
            exit 1
          fi
          echo "Sve je prošlo bez grešaka."
